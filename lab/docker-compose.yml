services:
  emulator:
    build:
      context: ./emulator
      dockerfile: Dockerfile
    container_name: vuln-emulator
    # Internal network only - no host access
    networks:
      lab-network:
        ipv4_address: 172.28.0.2
    # Restart policy for reliability
    restart: unless-stopped
    # Resource limits for isolation
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run

  executor:
    build:
      context: .
      dockerfile: executor.Dockerfile
    container_name: vuln-executor
    # Expose HTTP API on port 9090 for host development access
    ports:
      - "9090:9090"
    # Connect to both networks:
    # - lab-network: can reach emulator at 172.28.0.2:8080
    # - default bridge: port 9090 published to host
    networks:
      lab-network:
        ipv4_address: 172.28.0.3
      default:
        ipv4_address: 172.18.0.3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run

networks:
  # Internal network for emulator - no external egress
  lab-network:
    driver: bridge
    internal: true
    name: vuln-lab-network
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
  # Default network for executor host access
  default:
    driver: bridge
    name: executor-network
